name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} / x64
    runs-on: windows-2025
    strategy:
      matrix:
        configuration: [Debug, Release]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare placeholder server configuration
        run: Copy-Item -LiteralPath Services/LocalSecrets.example.cs.txt -Destination Services/LocalSecrets.cs

      - name: Check source isolation
        run: ./tools/Assert-Distribution.ps1 -CheckSource

      - name: Add private file probes
        run: |
          New-Item -ItemType Directory -Path docs/internal, Assets/internal -Force | Out-Null
          Set-Content docs/internal/probe.txt 'DO NOT SUBMIT'
          Set-Content Assets/internal/probe.png 'DO NOT SUBMIT'
          Set-Content Assets/isolation-unlisted.png 'Unapproved image probe'
          Set-Content isolation-do-not-submit.zip 'Private archive probe'

      - name: Restore dependencies
        run: dotnet restore LinxLauncher.WinUI.csproj -p:Platform=x64 -r win-x64 --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build LinxLauncher.WinUI.csproj -c ${{ matrix.configuration }} -p:Platform=x64 --no-restore -o artifacts/build/${{ matrix.configuration }}

      - name: Verify build output
        run: ./tools/Assert-Distribution.ps1 -OutputDirectory artifacts/build/${{ matrix.configuration }} -ManifestPath artifacts/build-${{ matrix.configuration }}.csv

  publish:
    name: Release AOT / x64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare placeholder server configuration
        run: Copy-Item -LiteralPath Services/LocalSecrets.example.cs.txt -Destination Services/LocalSecrets.cs

      - name: Check source isolation
        run: ./tools/Assert-Distribution.ps1 -CheckSource

      - name: Add private file probes
        run: |
          New-Item -ItemType Directory -Path docs/internal, Assets/internal -Force | Out-Null
          Set-Content docs/internal/probe.txt 'DO NOT SUBMIT'
          Set-Content Assets/internal/probe.png 'DO NOT SUBMIT'
          Set-Content Assets/isolation-unlisted.png 'Unapproved image probe'
          Set-Content isolation-do-not-submit.zip 'Private archive probe'

      - name: Publish Native AOT
        run: dotnet publish LinxLauncher.WinUI.csproj -c Release -r win-x64 -p:Platform=x64 -p:PublishAot=true -p:SelfContained=true -o artifacts/publish/win-x64

      - name: Verify publish output
        run: ./tools/Assert-Distribution.ps1 -OutputDirectory artifacts/publish/win-x64 -NativeAot -ManifestPath artifacts/publish-win-x64.csv
